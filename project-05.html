<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>디자인 시스템 공통화</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><style>
:root{--bg:#fff;--surface:#f5f5f7;--fg:#1d1d1f;--muted:#6e6e73;--line:#eeeeee;--max:1600px;--page-gutter:80px}*{box-sizing:border-box}body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--fg);font-family:"Pretendard",sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}a{color:inherit}a:focus-visible{outline:3px solid var(--fg);outline-offset:5px}.project-shell{width:min(var(--max),calc(100% - var(--page-gutter) * 2));margin:auto}.project-nav{z-index:20;display:flex;align-items:center;min-height:62px;background:rgba(255,255,255,.88);border:1px solid var(--line);backdrop-filter:saturate(180%) blur(18px)}.project-nav-inline{position:relative;width:100vw;margin-left:calc(50% - 50vw);padding:8px max(var(--page-gutter),calc((100vw - var(--max))/2));border-width:0 0 1px;border-radius:0;transition:transform .28s ease,opacity .2s ease}.project-nav-inline.is-hidden{transform:translateY(12px);opacity:0;pointer-events:none}.project-nav-fixed{position:fixed;top:12px;left:max(var(--page-gutter),calc((100vw - var(--max))/2));width:max-content;min-height:48px;padding:8px 16px;border:1px solid var(--line);border-radius:22px;transform:translateY(calc(-100% - 24px));opacity:0;pointer-events:none;transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .24s ease}.project-nav-fixed.is-visible{transform:translateY(0);opacity:1;pointer-events:auto}.project-nav-trigger{height:1px;margin-top:-1px}.project-back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;font-size:.88rem;font-weight:500;white-space:nowrap}.project-chevron{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.project-images{display:flex;flex-direction:column;gap:0}.project-images.is-full-bleed{width:100vw;margin-left:calc(50% - 50vw)}.project-images img{display:block;width:100%;height:auto;flex:none}.project-images img + img{margin-top:-1px}.project-pagination{padding:32px 0 64px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}.project-pagination-link{display:flex;flex-direction:row;align-items:center;gap:12px;min-width:0;text-decoration:none}.project-pagination-link.is-next{justify-content:flex-end;text-align:right}.project-pagination-label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}.project-pagination-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:600;line-height:1.4}@media(max-width:1200px){:root{--page-gutter:48px}}@media(max-width:620px){:root{--page-gutter:16px}.project-nav{min-height:56px}.project-nav-inline{padding:7px var(--page-gutter)}.project-nav-fixed{top:8px;left:10px;min-height:44px;padding:6px 12px;border-radius:18px}.project-back{font-size:.78rem}.project-pagination{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:24px 0 48px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}.project-nav-fixed,.project-nav-inline{transition:none}}
</style></head><body><nav class="project-nav project-nav-fixed" aria-label="프로젝트 목록으로" aria-hidden="true" inert><a class="project-back" href="index.html#projects"><svg class="project-chevron project-chevron-left" aria-hidden="true" viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg><span>목록으로</span></a></nav><main class="project-shell"><nav class="project-nav project-nav-inline" aria-label="프로젝트 목록으로"><a class="project-back" href="index.html#projects"><svg class="project-chevron project-chevron-left" aria-hidden="true" viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg><span>목록으로</span></a></nav><div class="project-nav-trigger" aria-hidden="true"></div><section class="project-images is-seamless is-full-bleed" aria-label="디자인 시스템 공통화 포트폴리오"><img src="assets/project-05/project-05-01.avif" alt="디자인 시스템 공통화 프로젝트 표지" width="3334" height="1873" decoding="async" fetchpriority="high"><img src="assets/project-05/project-05-02.avif" alt="디자인 시스템 공통화 프로젝트 상세 화면 2" width="3334" height="1872" decoding="async" loading="lazy"><img src="assets/project-05/project-05-03.avif" alt="디자인 시스템 공통화 프로젝트 상세 화면 3" width="3334" height="1872" decoding="async" loading="lazy"><img src="assets/project-05/project-05-04.avif" alt="디자인 시스템 공통화 프로젝트 상세 화면 4" width="3334" height="1872" decoding="async" loading="lazy"><img src="assets/project-05/project-05-05.avif" alt="디자인 시스템 공통화 프로젝트 상세 화면 5" width="3334" height="1872" decoding="async" loading="lazy"><img src="assets/project-05/project-05-06.avif" alt="디자인 시스템 공통화 프로젝트 상세 화면 6" width="3334" height="1872" decoding="async" loading="lazy"><img src="assets/project-05/project-05-07.avif" alt="디자인 시스템 공통화 프로젝트 상세 화면 7" width="3334" height="1872" decoding="async" loading="lazy"><img src="assets/project-05/project-05-08.avif" alt="디자인 시스템 공통화 프로젝트 상세 화면 8" width="3334" height="1872" decoding="async" loading="lazy"><img src="assets/project-05/project-05-09.avif" alt="디자인 시스템 공통화 프로젝트 상세 화면 9" width="3334" height="1872" decoding="async" loading="lazy"><img src="assets/project-05/project-05-10.avif" alt="디자인 시스템 공통화 프로젝트 상세 화면 10" width="3334" height="1872" decoding="async" loading="lazy"></section><nav class="project-pagination" aria-label="프로젝트 탐색"><a class="project-pagination-link is-previous" href="project-04.html"><span class="project-pagination-label"><svg class="project-chevron project-chevron-left" aria-hidden="true" viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>이전</span><strong class="project-pagination-title">정기 선적 리포트</strong></a><a class="project-pagination-link is-next" href="project-06.html"><strong class="project-pagination-title">스케줄 데모 이용률 증대</strong><span class="project-pagination-label">다음<svg class="project-chevron project-chevron-right" aria-hidden="true" viewBox="0 0 16 16"><path d="m6 3.5 4.5 4.5L6 12.5"/></svg></span></a></nav></main><script>
const fixedNav=document.querySelector(".project-nav-fixed");
const inlineNav=document.querySelector(".project-nav-inline");
const navTrigger=document.querySelector(".project-nav-trigger");
const setFixedNav=(show)=>{fixedNav.classList.toggle("is-visible",show);fixedNav.setAttribute("aria-hidden",String(!show));fixedNav.toggleAttribute("inert",!show)};
const navObserver=new IntersectionObserver(([entry])=>{setFixedNav(!entry.isIntersecting&&entry.boundingClientRect.top<0)},{threshold:0});
navObserver.observe(navTrigger);
const updateInlineNav=()=>{const hide=window.scrollY>0;inlineNav.classList.toggle("is-hidden",hide);inlineNav.setAttribute("aria-hidden",String(hide));inlineNav.toggleAttribute("inert",hide)};
window.addEventListener("scroll",updateInlineNav,{passive:true});
updateInlineNav();
</script></body></html>
